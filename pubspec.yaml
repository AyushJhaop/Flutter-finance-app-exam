name: fintrack
description: "FinTrack — AI-Powered Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Biometric
  local_auth: ^2.3.0

  # Formatting
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.70.2

  # Connectivity
  connectivity_plus: ^6.1.4

  # Animations
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_foundation: 2.4.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts served via google_fonts package at runtime
